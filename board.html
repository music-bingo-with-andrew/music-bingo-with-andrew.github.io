<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14161c">
<title>Music Bingo · Leaderboard</title>
<style>
:root{--bg:#14161c;--panel:#1d2029;--line:#2c3040;--text:#e8e9ee;--muted:#9097a8;--accent:#f2b134;--ok:#3ecf8e}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:18px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 30px}
h1{margin:6px 0 0;text-align:center;font:900 30px "Arial Black",Arial,sans-serif;color:var(--accent)}
#ven{text-align:center;color:var(--muted);font-size:18px;margin-bottom:10px}
ol{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:24px;font-weight:800}
li .rk{width:38px;color:var(--accent)}li .nm{flex:1;letter-spacing:1px}li .pt{color:var(--accent)}li .here{font-size:15px;color:var(--ok);font-weight:700}
li.flash{animation:fl 1.6s ease-out 2}@keyframes fl{0%{background:#1d5a3e}100%{background:var(--panel)}}
#stat{text-align:center;color:var(--muted);font-size:15px;margin-top:12px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px;background:#2a2f3d;color:var(--text);width:100%;margin-top:12px}
#codeBox{display:none;text-align:center}#codeBox input{font:900 34px "Courier New",monospace;letter-spacing:8px;text-transform:uppercase;width:100%;text-align:center;padding:10px;border-radius:10px;border:1px solid #3a4052;background:#11131a;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏆 Leaderboard</h1>
  <div id="ven">Waiting for the laptop…</div>
  <div id="codeBox"><div style="margin:10px 0">Type the player code (4 letters)</div><input id="code" maxlength="4"><button id="codeGo" style="background:var(--accent);color:#1a1300">Show leaderboard</button></div>
  <ol id="list"></ol>
  <button id="again">↻ Refresh</button>
  <div id="stat"></div>
</div>
<script>
// Andrew's leaderboard: asks the MusicBingo laptop for the current board and updates live after every bingo.
const $ = s => document.querySelector(s);
const PREFIX = 'mbdc7q-', RELAY = 'https://ntfy.sh';
let CODE = (location.hash.slice(1) || localStorage.getItem('mbCode') || '').replace(/[^A-Za-z]/g, '').toUpperCase();
let es = null, old = {}, lastT = 0;
function askCode(){ $('#codeBox').style.display = 'block'; $('#code').value = CODE; }
$('#codeGo').onclick = () => { const c = $('#code').value.replace(/[^A-Za-z]/g, '').toUpperCase(); if(c.length !== 4) return; CODE = c; try{ localStorage.setItem('mbCode', JSON.stringify(c)); }catch(e){} $('#codeBox').style.display = 'none'; start(); };
function render(m){
  $('#ven').textContent = (m.venue || '') + (m.test ? ' · practice game' : '');
  const ol = $('#list'); ol.innerHTML = '';
  (m.board || []).forEach((r, k) => {
    const li = document.createElement('li'); if(old[r[0]] != null && old[r[0]] !== r[1]) li.className = 'flash';
    const a = document.createElement('span'); a.className = 'rk'; a.textContent = k === 0 ? '★' : k + 1;
    const b = document.createElement('span'); b.className = 'nm'; b.textContent = r[0];
    if(r[2]){ const h = document.createElement('span'); h.className = 'here'; h.textContent = ' ✓ here'; b.append(h); }
    const c = document.createElement('span'); c.className = 'pt'; c.textContent = r[1] + (r[1] === 1 ? ' pt' : ' pts');
    li.append(a, b, c); ol.append(li);
  });
  if(!(m.board || []).length) $('#ven').textContent = 'No players at ' + (m.venue || 'this venue') + ' yet';
  old = {}; for(const r of m.board || []) old[r[0]] = r[1];
  $('#stat').textContent = 'Updated ' + new Date(m.t || Date.now()).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'}) + ' · updates by itself after every bingo';
}
function ask(){ fetch(RELAY + '/' + PREFIX + CODE.toLowerCase() + '-in', {method: 'POST', body: JSON.stringify({mb: 'board?', t: Date.now()})}).catch(() => {}); }
function start(){
  if(!/^[A-Z]{4}$/.test(CODE)){ askCode(); return; }
  if(es) es.close();
  es = new EventSource(RELAY + '/' + PREFIX + CODE.toLowerCase() + '-board/sse?since=12h');
  es.onmessage = ev => { let d, m; try{ d = JSON.parse(ev.data); m = JSON.parse(d.message); }catch(e){ return; } if(m.mb !== 'board' || (m.t || 0) < lastT) return; lastT = m.t || 0; render(m); };
  es.onerror = () => { $('#stat').textContent = 'Reconnecting… (check your internet)'; };
  setTimeout(ask, 800);
}
$('#again').onclick = () => { $('#stat').textContent = 'Asking the laptop…'; ask(); };
document.addEventListener('visibilitychange', () => { if(!document.hidden){ if(!es || es.readyState === 2) start(); else ask(); } });
try{ const c = JSON.parse(localStorage.getItem('mbCode')); if(!location.hash && c) CODE = String(c).toUpperCase(); }catch(e){}
start();
</script>
</body>
</html>
